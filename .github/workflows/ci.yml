name: CI Pipeline

on:
  push: {}
  pull_request: {}

jobs:
  # 1. Lint — базовая проверка, нужна всем остальным
  lint:
    name: Lint with Pylint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Pylint
        run: pylint src

  # 2. CLI tests — после lint
  cli_tests:
    name: BDD CLI tests (Cucumber+Aruba)
    needs: lint
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
      - name: Bundle install
        run: bundle install --jobs 4 --retry 3
      - name: Run Cucumber features
        run: |
          bundle exec cucumber \
            --require features \
            --require aruba/cucumber \
            --tags "not @wip" \
            --format pretty

  # 3a. Stress tests — после cli_tests
  stress:
    name: Stress tests
    needs: cli_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run stress tests
        run: python -m pytest tests/stress_test.py

  # 3b. Memory check — тоже после cli_tests, параллельно stress
  valgrind:
    name: Memory check with Valgrind
    needs: cli_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Run Valgrind
        uses: Ximaz/valgrind-action@v1.2.0
        with:
          binary_path: "python"
          binary_args: "src/app.py greet --name CI"

  # 3c. Profiling — тоже после cli_tests, параллельно stress и valgrind
  profiling:
    name: Time profiling
    needs: cli_tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job:
          - name: greet
            cmd: python src/app.py greet --name CI
          - name: sum
            cmd: python src/app.py sum 1 2 3.5
          - name: echo
            cmd: >
              printf "test\nLine" | python src/app.py echo
    steps:
      - uses: actions/checkout@v4
      - name: Profile execution time for ${{ matrix.job.name }}
        run: |
          /usr/bin/time -f "real %e user %U sys %S" \
            ${{ matrix.job.cmd }} 2> time-${{ matrix.job.name }}.log
          cat time-${{ matrix.job.name }}.log

  # 4. stdin_stress — только после stress
  stdin_stress:
    name: Stress stdin
    needs: stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run stdin stress tests
        run: python tests/stress_stdin.py
